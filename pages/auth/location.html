<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Where are you looking for opportunities? | Tenders & Bids</title>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">

    <link rel="icon" href="../../assets/logos/navbar-logo.png">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
</head>

<body>

    <div id="site-header"></div>

    <main class="page-shell">
        <section class="onboarding-shell unique-shell" aria-label="Location selection">
            <div class="onboarding-container">

                <!-- 1. Step Indicator -->
                <div class="step-indicator">
                    <span>Step 3 of 4</span>

                    <div class="step-dots">
                        <span class="step-dot is-active"></span>
                        <span class="step-dot is-active"></span>
                        <span class="step-dot is-active"></span>
                        <span class="step-dot is-soft"></span>
                    </div>
                </div>

                <!-- 2. Header Section -->
                <div class="onboarding__header">
                    <h1 class="onboarding-title">Where are you looking for opportunities?</h1>
                    <p class="onboarding-subtitle">
                        Select the countries or markets you want to monitor.
                        You can refine your locations anytime.
                    </p>
                </div>

                <!-- 3. Location Content -->
                <div class="onboarding__verification">
                    <div class="onboarding_field has-icon">
                        <span class="material-symbols-rounded input-icon">search</span>
                        <input type="text" placeholder="Search and add countries..." aria-label="Search countries" />
                    </div>

                    <div id="location-groups" class="toggle-list"></div>
                </div>

                <!-- 4. Actions Section -->
                <div class="onboarding-card__legal">
                    <button class="secondary-btn" type="button" data-next="notifications.html">Continue</button>
                    <p class="onboarding-note"><a href="notifications.html">Skip for now</a></p>
                </div>

            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="../../js/data.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/main.js"></script>
    <script src="./auth.js"></script>
</body>

</html>
