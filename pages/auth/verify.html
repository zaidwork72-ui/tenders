<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Check your email | Tenders & Bids</title>

    <link rel="icon" href="../../assets/logos/navbar-logo.png">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <!-- <link rel="stylesheet" href="./auth.css" /> -->
</head>

<body>
    <div id="site-header"></div>

    <main class="page-shell">
        <section class="onboarding-shell" aria-label="Email verification card">
            <div class="onboarding-container">
                            <!-- 1. Header Section -->
            <div class="onboarding__header">
                <h1 class="onboarding-title">Check your email</h1>
                <p class="onboarding-subtitle">
                    We sent a 6-digit code to
                    <strong>your@email.com</strong>
                </p>
            </div>

            <!-- 2. Verification Section -->
            <div class="onboarding__verification">
                <div class="onboarding_field">
                    <label>Verify code</label>
                    <div class="onboarding-box">
                        <input class="onboarding-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 1" />
                        <input class="onboarding-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" />
                        <input class="onboarding-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" />
                        <input class="onboarding-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" />
                        <input class="onboarding-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" />
                        <input class="onboarding-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" />
                    </div>
                </div>

                <button class="secondary-btn" type="button" data-next="create-account.html">
                    Verify Code
                </button>
            </div>

            <!-- 3. Footer Section -->
            <div class="onboarding-card__legal">
                <p class="onboarding-note">
                    Didn't receive it?
                    <a href="email-verify.html">Resend code</a>
                </p>

                <p class="onboarding-note">
                    <a href="login.html">← Back to email</a>
                </p>
            </div>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>

    <script src="../../js/data.js"></script>
    <script src="../../js/components.js"></script>
    <script src="./auth.js"></script>
    <script src="../../js/main.js"></script>

</body>
</html>
